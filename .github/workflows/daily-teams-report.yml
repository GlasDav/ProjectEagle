name: Daily Teams Report

on:
  workflow_dispatch:
  schedule:
    # 10:37 Australia/Sydney during daylight saving time.
    - cron: "37 23 * * *"
    # 10:37 Australia/Sydney during standard time.
    - cron: "37 0 * * *"

jobs:
  send-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PERFSRAPER_TEAMS_WEBHOOK_URL: ${{ secrets.PROJECTEAGLE_TEAMS_WEBHOOK_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve Sydney schedule window
        id: schedule
        shell: bash
        env:
          TRIGGERING_SCHEDULE: ${{ github.event.schedule }}
        run: |
          SYDNEY_OFFSET=$(TZ=Australia/Sydney date +%z)
          REPORT_DATE=$(TZ=Australia/Sydney date -d '2 days ago' +%F)
          EXPECTED_SCHEDULE="37 0 * * *"
          if [ "$SYDNEY_OFFSET" = "+1100" ]; then
            EXPECTED_SCHEDULE="37 23 * * *"
          fi

          echo "sydney_offset=$SYDNEY_OFFSET" >> "$GITHUB_OUTPUT"
          echo "triggering_schedule=$TRIGGERING_SCHEDULE" >> "$GITHUB_OUTPUT"
          echo "expected_schedule=$EXPECTED_SCHEDULE" >> "$GITHUB_OUTPUT"
          echo "report_date=$REPORT_DATE" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$TRIGGERING_SCHEDULE" = "$EXPECTED_SCHEDULE" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip inactive Sydney DST schedule
        if: steps.schedule.outputs.should_run != 'true'
        run: |
          echo "Skipping scheduled run for '${{ steps.schedule.outputs.triggering_schedule }}'; expected '${{ steps.schedule.outputs.expected_schedule }}' for Sydney offset ${{ steps.schedule.outputs.sydney_offset }}."

      - name: Validate Teams webhook secret
        if: steps.schedule.outputs.should_run == 'true'
        shell: bash
        run: |
          if [ -z "$PERFSRAPER_TEAMS_WEBHOOK_URL" ]; then
            echo "Missing GitHub Actions secret: PROJECTEAGLE_TEAMS_WEBHOOK_URL" >&2
            exit 1
          fi

      - name: Install dependencies
        if: steps.schedule.outputs.should_run == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate report and post to Teams
        if: steps.schedule.outputs.should_run == 'true'
        shell: bash
        run: |
          python main.py \
            --no-cache \
            --as-of "${{ steps.schedule.outputs.report_date }}" \
            --export html \
            --output-dir reports \
            --send-teams

      - name: Upload HTML artifact
        if: steps.schedule.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fund-report-${{ steps.schedule.outputs.report_date }}
          path: reports/*.html
          if-no-files-found: error
